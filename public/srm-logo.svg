<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      .srm-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 11px; letter-spacing: 2px; }
      .srm-motto { font-family: Arial, sans-serif; font-weight: bold; font-size: 10px; letter-spacing: 1px; }
    </style>
  </defs>
  
  <!-- Outer gold circle border with dots -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#C9A961" stroke-width="8"/>
  <g id="dots">
    <circle cx="100" cy="8" r="2.5" fill="#C9A961"/>
    <circle cx="125" cy="12" r="2.5" fill="#C9A961"/>
    <circle cx="146" cy="25" r="2.5" fill="#C9A961"/>
    <circle cx="162" cy="43" r="2.5" fill="#C9A961"/>
    <circle cx="171" cy="62" r="2.5" fill="#C9A961"/>
    <circle cx="175" cy="82" r="2.5" fill="#C9A961"/>
    <circle cx="175" cy="102" r="2.5" fill="#C9A961"/>
    <circle cx="170" cy="122" r="2.5" fill="#C9A961"/>
    <circle cx="160" cy="140" r="2.5" fill="#C9A961"/>
    <circle cx="146" cy="155" r="2.5" fill="#C9A961"/>
    <circle cx="129" cy="167" r="2.5" fill="#C9A961"/>
    <circle cx="110" cy="175" r="2.5" fill="#C9A961"/>
    <circle cx="90" cy="178" r="2.5" fill="#C9A961"/>
    <circle cx="70" cy="176" r="2.5" fill="#C9A961"/>
    <circle cx="52" cy="168" r="2.5" fill="#C9A961"/>
    <circle cx="37" cy="156" r="2.5" fill="#C9A961"/>
    <circle cx="25" cy="141" r="2.5" fill="#C9A961"/>
    <circle cx="16" cy="124" r="2.5" fill="#C9A961"/>
    <circle cx="10" cy="105" r="2.5" fill="#C9A961"/>
    <circle cx="9" cy="85" r="2.5" fill="#C9A961"/>
    <circle cx="13" cy="65" r="2.5" fill="#C9A961"/>
    <circle cx="22" cy="48" r="2.5" fill="#C9A961"/>
    <circle cx="35" cy="32" r="2.5" fill="#C9A961"/>
    <circle cx="51" cy="21" r="2.5" fill="#C9A961"/>
    <circle cx="70" cy="13" r="2.5" fill="#C9A961"/>
  </g>
  
  <!-- Light gray background circle -->
  <circle cx="100" cy="100" r="85" fill="#E8E8E8"/>
  
  <!-- Dark blue center circle -->
  <circle cx="100" cy="100" r="70" fill="#004B9E"/>
  
  <!-- Stylized tree (white) -->
  <g>
    <!-- Tree trunk -->
    <path d="M 100 145 L 95 165 L 105 165 Z" fill="white"/>
    <!-- Tree foliage -->
    <circle cx="85" cy="85" r="18" fill="white" opacity="0.95"/>
    <circle cx="100" cy="70" r="22" fill="white" opacity="0.95"/>
    <circle cx="115" cy="85" r="18" fill="white" opacity="0.95"/>
    <circle cx="92" cy="100" r="15" fill="white" opacity="0.95"/>
    <circle cx="108" cy="100" r="15" fill="white" opacity="0.95"/>
    <circle cx="80" cy="105" r="12" fill="white" opacity="0.95"/>
    <circle cx="120" cy="105" r="12" fill="white" opacity="0.95"/>
  </g>
  
  <!-- Navigation icon (map pin) overlaid on tree - positioned on top right -->
  <g id="nav-pin" transform="translate(110, 70)">
    <!-- Pin shape -->
    <path d="M 0 0 C -6 -6 -10 -2 -10 4 C -10 10 0 20 0 20 C 0 20 10 10 10 4 C 10 -2 6 -6 0 0 Z" fill="#FF6B35" opacity="0.95"/>
    <!-- Pin center dot -->
    <circle cx="0" cy="4" r="2" fill="white"/>
  </g>
  
  <!-- Text arc: "SRM INSTITUTE OF SCIENCE AND TECHNOLOGY" -->
  <defs>
    <path id="topCurve" d="M 25 100 A 75 75 0 0 1 175 100" fill="none"/>
    <path id="bottomCurve" d="M 175 100 A 75 75 0 0 1 25 100" fill="none"/>
  </defs>
  
  <text class="srm-text" fill="#004B9E" letter-spacing="1.5">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      SRM INSTITUTE OF SCIENCE AND TECHNOLOGY
    </textPath>
  </text>
  
  <!-- Ribbon banner -->
  <path d="M 60 140 Q 100 145 140 140 L 138 150 Q 100 155 62 150 Z" fill="white" stroke="#004B9E" stroke-width="1"/>
  
  <!-- Banner text: "LEARN • LEAP • LEAD" -->
  <text class="srm-motto" fill="#004B9E" x="100" y="148" text-anchor="middle">
    LEARN • LEAP • LEAD
  </text>
</svg>